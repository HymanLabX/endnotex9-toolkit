name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install uv
          uv sync --locked --python ${{ matrix.python-version }} --extra pdf --extra dev
      - name: Lint
        run: uv run --locked --no-sync python -m ruff check src tests skills
      - name: Format
        run: uv run --locked --no-sync python -m ruff format --check src tests skills
      - name: Test
        run: uv run --locked --no-sync python -m pytest
      - name: Build distributions
        run: uv run --locked --no-sync python -m build
