[project]
name = "endnotex9-mcp"
version = "0.1.0"
description = "A local-first MCP server for searching, classifying, citing, and reading EndNote X9 libraries"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "xiangsanfen" },
]
keywords = [
    "endnote",
    "mcp",
    "codex",
    "claude",
    "references",
    "citation",
    "academic",
    "research",
    "literature",
    "pdf",
    "bibliography",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.0.0",
    "lxml>=5.0",
    "jieba>=0.42",
    "watchdog>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
endnotex9-mcp = "endnotex9_mcp.cli:main"

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0 while this package is MIT. Keep PDF extraction opt-in.
pdf = ["pymupdf>=1.24"]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endnotex9_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
docstring-code-format = true
