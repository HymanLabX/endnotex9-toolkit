[project]
name = "endnotex9-toolkit"
version = "0.3.0"
description = "A local-first MCP server for searching, classifying, citing, and reading EndNote X9 libraries"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "xiangsanfen" },
]
keywords = [
    "endnote",
    "mcp",
    "codex",
    "claude",
    "references",
    "citation",
    "academic",
    "research",
    "literature",
    "pdf",
    "bibliography",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.0.0",
    "lxml>=5.0",
    "jieba>=0.42",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    # pydantic, which the MCP SDK uses to build tool schemas, rejects
    # `typing.TypedDict` below 3.12. Depended on directly rather than
    # inherited from pydantic, since resolver.py imports it by name.
    'typing-extensions>=4.12; python_version < "3.12"',
]

[project.scripts]
endnotex9-toolkit = "endnotex9_toolkit.cli:main"
# The command's name before 0.2.0, kept so MCP client configurations that
# register `endnotex9-mcp serve` by hand keep starting the server.
endnotex9-mcp = "endnotex9_toolkit.cli:main"

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0 while this package is MIT. Keep PDF extraction opt-in.
pdf = ["pymupdf>=1.24"]
lit-downloader = [
    "playwright>=1.62",
    "pymupdf>=1.24",
    'pywinauto>=0.6.9; sys_platform == "win32"',
    # OS certificate verification for OA downloads (see retrieval._tls_context).
    "truststore>=0.9",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endnotex9_toolkit"]

[tool.hatch.build.targets.sdist]
# Keep machine settings, private reports and cleanup backups out of release archives.
exclude = [
    "/.claude/**",
    "/.codex/**",
    "/backups/**",
    "/dist/**",
    "/skills/**/scripts/out/**",
    "**/__pycache__/**",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E501 is deliberately absent, the way ruff itself recommends when the
# formatter is in use: `line-length` above is enforced by `ruff format`
# (CI runs `ruff format --check`), which wraps everything it can. What E501
# would add on top is the handful of lines no formatter can split -- SQL
# and f-strings in one literal -- where the only way to satisfy it is to
# chop a statement mid-string for the linter's benefit.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
docstring-code-format = true
